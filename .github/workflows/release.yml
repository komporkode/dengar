name: Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            target_os: windows
          - os: ubuntu-22.04
            platform: linux/amd64
            target_os: linux
            artifact_name: dengerin-linux-amd64.tar.gz
          - os: macos-latest
            platform: darwin/universal
            target_os: darwin
            artifact_name: dengerin-macos-universal.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application (Windows)
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -clean -nsis -o dengerin.exe

      - name: Build Application (Non-Windows)
        if: runner.os != 'Windows'
        run: wails build -platform ${{ matrix.platform }} -clean -o dengerin

      - name: Package Windows Artifacts (Installer & Portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/dengerin.exe -DestinationPath dengerin-windows-amd64-portable.zip
          $installer = Get-ChildItem -Path build/bin -Filter "*installer.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "dengerin-windows-amd64-installer.exe"
          }

      - name: Package Linux Artifact
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar -czvf ../../${{ matrix.artifact_name }} dengerin

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ../../${{ matrix.artifact_name }} dengerin.app

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        with:
          files: |
            dengerin-windows-amd64-installer.exe
            dengerin-windows-amd64-portable.zip

      - name: Upload Linux/macOS Binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        with:
          files: ${{ matrix.artifact_name }}
