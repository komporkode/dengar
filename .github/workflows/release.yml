name: Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: dengar-windows-amd64.zip
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact_name: dengar-linux-amd64.tar.gz
          - os: macos-latest
            platform: darwin/universal
            artifact_name: dengar-macos-universal.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/dengar.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Linux Artifact
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar -czvf ../../${{ matrix.artifact_name }} dengar

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ../../${{ matrix.artifact_name }} dengar.app

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
